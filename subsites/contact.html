<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trnava</title>
    <link rel="icon" href="/assets/favicons/main.ico">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        ul {
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            gap: 50px;
            list-style: none;
            padding-left: 0;
        }

        ul li {
            display: flex;
            align-items: center;
        }

        ul li::before {
            content: '';
            display: inline-block;
            width: 50px;
            height: 50px;
            background-image: url("/assets/images/trnava__ikona_farebne.png");
            background-size: contain;
            background-repeat: no-repeat;
            margin-right: 8px;
        }

        a {
            font-size: 30px;
            font-weight: bold;
            padding-left: 0;
            color: #000000;
        }

        a:hover {
            color: #000000;
            background: none;
        }

        a:visited {
            color: #000000;
        }

        #stranka_kontankt {
        <!-- Toto upravuje veľkosť posledného itemu tak aby nebol moc veľský -->
            width: 50px;
        }

    </style>
</head>
<body>
<div class="paper">
    <a href="../main.html"><img src="/assets/images/trnava_logo_farebne.png" width="250" height="100" alt="Trnava logo" id="back_logo_button"></a>
    <h1>Kontakt</h1>
    <ul>
        <li>+421 33 32 36 101</li>
        <li>info@trnava.sk</li>
        <li>Hlavná ulica 1, 917 71 Trnava</li>
        <li><a href="https://www.trnava.sk" id="stranka_kontankt">www.trnava.sk</a></li>
    </ul>
</div>
</body>
</html>
